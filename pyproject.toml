[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-experiments"
version = "0.1.0"
description = "Real-query layerwise recovery of polynomial networks"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mpmath", "matplotlib", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]
baselines = ["torch"]

[project.scripts]
aspire-run = "aspire.run:main"
aspire-plot = "aspire.plot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = "cache/pytest"
