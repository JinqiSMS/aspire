# Experimental choices; not theorem-certified constants.
experiment_name: sampling_ablation
kind: single_layer
oracle:
  mode: true_suffix_debug
diagnostic:
  reference_directions: 1024
sweep:
- sampler.mode: independent_endpoints
  sampler.endpoint_steps: 64
- sampler.mode: independent_endpoints
  sampler.endpoint_steps: 256
- sampler.mode: independent_endpoints
  sampler.endpoint_steps: 1024
- sampler.burn_in: 64
  sampler.thin: 1
- sampler.burn_in: 256
  sampler.thin: 4
- sampler.burn_in: 1024
  sampler.thin: 8
