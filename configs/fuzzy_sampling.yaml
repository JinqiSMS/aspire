experiment_name: fuzzy_sampling
kind: sampler_check
oracle:
  mode: true_suffix_debug
recovery:
  moment_samples_by_layer: [1024]
sampler:
  burn_in: 128
  thin: 2
  xi_source: synthetic_known_global_bound
sweep:
  - sampler.xi_by_layer: [0.0]
  - sampler.xi_by_layer: [0.000001]
  - sampler.xi_by_layer: [0.0001]
  - sampler.xi_by_layer: [0.01]
